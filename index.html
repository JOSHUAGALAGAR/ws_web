<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebSocket Listener</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app-container">
        <header class="app-header">
            <div class="header-top">
                <h1>WebSocket Listener</h1>
                <span class="status-badge" id="status">Connecting...</span>
            </div>
            <div class="header-meta">
                <span class="message-count" id="messageCount">0 messages</span>
                <button class="btn-clear" id="clearBtn" title="Refresh dashboard">Refresh</button>
            </div>
        </header>

        <nav class="tabs" aria-label="Dashboard views">
            <button class="tab-btn active" type="button" data-tab="bins">Bins</button>
            <button class="tab-btn" type="button" data-tab="vfd">VFD</button>
            <button class="tab-btn" type="button" data-tab="raw">Raw Messages</button>
        </nav>

        <main class="tab-content">
            <section class="tab-panel active" id="binsPanel">
                <div class="summary-grid">
                    <div class="summary-card">
                        <span>Total Graph</span>
                        <strong id="chartValue">No data</strong>
                    </div>
                    <div class="summary-card warning">
                        <span>NO DATA</span>
                        <strong id="noDataCount">0</strong>
                    </div>
                    <div class="summary-card danger">
                        <span>Errors</span>
                        <strong id="errorCount">0</strong>
                    </div>
                    <div class="summary-card">
                        <span>Data Graphs</span>
                        <strong id="dataGraphCount">0 active</strong>
                    </div>
                </div>

                <div class="chart-row">
                    <section class="chart-panel" aria-label="Live data graph">
                        <div class="chart-header">
                            <h2>Total Live Graph</h2>
                        </div>
                        <canvas id="dataChart" width="672" height="180"></canvas>
                    </section>

                    <section class="chart-panel" aria-label="Latest values bar chart">
                        <div class="chart-header">
                            <h2>Latest Values</h2>
                        </div>
                        <canvas id="barChart" width="672" height="220"></canvas>
                    </section>
                </div>

                <section class="chart-panel" aria-label="Bin status">
                    <div class="chart-header">
                        <h2>Bin Status</h2>
                        <span id="binStatusCount">0 active</span>
                    </div>
                    <div class="status-grid" id="binStatusGrid"></div>
                </section>

                <section class="chart-panel" aria-label="Bin weight graphs">
                    <div class="chart-header">
                        <h2>Bin Weight Graphs</h2>
                    </div>
                    <div class="data-grid" id="binGrid"></div>
                </section>
            </section>

            <section class="tab-panel" id="vfdPanel">
                <section class="chart-panel" aria-label="VFD monitor">
                    <div class="chart-header">
                        <h2>VFD Monitor</h2>
                        <span id="vfdGraphCount">0 active</span>
                    </div>
                    <div class="data-grid vfd-grid" id="vfdGrid"></div>
                </section>
            </section>

            <section class="tab-panel" id="rawPanel">
                <div id="messages"></div>
            </section>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
